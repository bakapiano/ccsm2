[package]
name = "ccsm-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "CCSM v2 Tauri desktop composition root"
default-run = "ccsm-desktop"

[lib]
name = "ccsm_desktop"
path = "src/lib.rs"

[[bin]]
name = "ccsm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[features]
default = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
base64 = "0.22.1"
ccsm-core.workspace = true
ccsm-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = ["unstable"] }
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
ts-rs.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18.5", features = ["png"] }
gio = "0.18.4"
gtk = "0.18.2"
webkit2gtk = "2.0.2"
