name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Validate tag and manifests
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "${tag}" == "${version}" ]]; then
            echo "Release tag must start with v: ${tag}" >&2
            exit 1
          fi

          node scripts/check-release-version.mjs "${version}"
          node --test .github/scripts/generate-update-manifest.test.mjs
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >>"${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >>"${GITHUB_OUTPUT}"
          fi

  quality:
    name: Release quality gate
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Package (${{ matrix.name }})
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
          - name: Ubuntu 24.04 x86_64
            os: ubuntu-24.04
            artifact: linux-x86_64
    env:
      CCSM_PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/.release-dist/${{ matrix.artifact }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      EXPECTED_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo bash .github/scripts/install-ubuntu-dependencies.sh \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libfuse2t64 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            xauth \
            xvfb

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing configuration
        shell: bash
        run: |
          test -n "${TAURI_SIGNING_PRIVATE_KEY}"
          test -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          test -n "${EXPECTED_UPDATER_PUBLIC_KEY}"
          node - <<'NODE'
          const { readFileSync } = require("node:fs");
          const config = JSON.parse(readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8"));
          if (config.plugins.updater.pubkey !== process.env.EXPECTED_UPDATER_PUBLIC_KEY) {
            throw new Error("release environment public key differs from tauri.conf.json");
          }
          NODE

      - name: Build Windows NSIS and updater
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version $env:RELEASE_VERSION

      - name: Build Linux DEB, AppImage, and updaters
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package-ubuntu.sh "${RELEASE_VERSION}"

      - name: Verify and install Windows NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = Resolve-Path $env:CCSM_PACKAGE_OUTPUT_DIR
          Push-Location $dist
          try {
            foreach ($line in Get-Content "SHA256SUMS-windows-x64.txt") {
              $parts = $line -split '\s+', 2
              $actual = (Get-FileHash -LiteralPath $parts[1] -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $parts[0]) { throw "Checksum mismatch for $($parts[1])" }
            }
          } finally { Pop-Location }

          $installer = Join-Path $dist "CCSM-$env:RELEASE_VERSION-windows-x64-setup.exe"
          ./scripts/test-windows-package.ps1 -InstallerPath $installer -DataDirectory (Join-Path $env:RUNNER_TEMP "ccsm-installed-smoke")

      - name: Verify and install Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          (
            cd "${CCSM_PACKAGE_OUTPUT_DIR}"
            sha256sum -c SHA256SUMS-linux-x86_64.txt
          )
          sudo env \
            CCSM_PACKAGE_SMOKE_DATA_DIR="${RUNNER_TEMP}/ccsm-package-smoke-data" \
            CCSM_PACKAGE_SMOKE_LOG_DIR="${RUNNER_TEMP}/ccsm-package-smoke-logs" \
            bash scripts/test-linux-packages.sh "${RELEASE_VERSION}" "${CCSM_PACKAGE_OUTPUT_DIR}"

      - name: Ensure lockfiles did not change
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml

      - name: Attest packaged artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/.release-dist/${{ matrix.artifact }}/CCSM-*

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccsm-${{ matrix.artifact }}
          path: ${{ github.workspace }}/.release-dist/${{ matrix.artifact }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          (
            cd dist
            sha256sum -c SHA256SUMS-windows-x64.txt
            sha256sum -c SHA256SUMS-linux-x86_64.txt
            find . -maxdepth 1 -type f -name 'CCSM-*' ! -name '*.sig' -print0 |
              sort -z | xargs -0 sha256sum >SHA256SUMS.txt
          )
          test -f "dist/CCSM-${RELEASE_VERSION}-windows-x64-setup.exe.sig"
          test -f "dist/CCSM-${RELEASE_VERSION}-linux-x86_64.deb.sig"
          test -f "dist/CCSM-${RELEASE_VERSION}-linux-x86_64.AppImage.sig"

      - name: Create and publish version release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="Signed Windows NSIS, Linux DEB, and Linux AppImage builds generated from ${GITHUB_SHA}."
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            create_args=(
              "${tag}"
              dist/*
              --repo "${GITHUB_REPOSITORY}"
              --verify-tag
              --fail-on-no-commits
              --title "CCSM v${RELEASE_VERSION}"
              --notes "${notes}"
              --generate-notes
              --draft
            )
            if [[ "${PRERELEASE}" == "true" ]]; then
              create_args+=(--prerelease --latest=false)
            fi
            gh release create "${create_args[@]}"
          fi

          edit_args=("${tag}" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft=false)
          if [[ "${PRERELEASE}" == "true" ]]; then
            edit_args+=(--prerelease --latest=false)
          else
            edit_args+=(--latest)
          fi
          gh release edit "${edit_args[@]}"
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body >release-notes.md

      - name: Generate and publish updater manifest
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          node scripts/generate-update-manifest.mjs \
            --version "${RELEASE_VERSION}" \
            --artifacts-dir dist \
            --base-url "${base_url}" \
            --notes-file release-notes.md \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output dist/latest.json
          gh release upload "${tag}" dist/latest.json --repo "${GITHUB_REPOSITORY}" --clobber

          channel="updater-beta"
          if ! gh release view "${channel}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${channel}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "CCSM Beta Updates" \
              --notes "Current signed CCSM beta updater manifest." \
              --prerelease \
              --latest=false
          fi
          gh release upload "${channel}" dist/latest.json --repo "${GITHUB_REPOSITORY}" --clobber
