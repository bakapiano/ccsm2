name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Validate tag and manifests
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "${tag}" == "${version}" ]]; then
            echo "Release tag must start with v: ${tag}" >&2
            exit 1
          fi

          node scripts/check-release-version.mjs "${version}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >>"${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >>"${GITHUB_OUTPUT}"
          fi

  quality:
    name: Release quality gate
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Package (${{ matrix.name }})
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            asset: windows-x64.zip
          - name: Ubuntu 24.04 x86_64
            os: ubuntu-24.04
            artifact: ubuntu-24.04-x86_64
            asset: ubuntu-24.04-x86_64.tar.gz
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version $env:RELEASE_VERSION

      - name: Build Ubuntu release archive
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package-ubuntu.sh "${RELEASE_VERSION}"

      - name: Verify Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "CCSM-$env:RELEASE_VERSION-windows-x64.zip"
          $archive = Join-Path "target/release" $name
          $expected = ((Get-Content -LiteralPath "$archive.sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Archive checksum mismatch: expected $expected, got $actual"
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP "ccsm-windows-package"
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          foreach ($relative in @("ccsm-desktop.exe", "BUILD-INFO.txt", "conpty/conpty.dll", "LICENSE", "README.md")) {
            if (-not (Test-Path -LiteralPath (Join-Path $extractRoot $relative) -PathType Leaf)) {
              throw "Missing packaged file: $relative"
            }
          }

      - name: Verify Ubuntu archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="CCSM-${RELEASE_VERSION}-ubuntu-24.04-x86_64"
          (
            cd target/release
            sha256sum -c "${name}.tar.gz.sha256"
          )
          extract_root="$(mktemp -d)"
          tar -xzf "target/release/${name}.tar.gz" -C "${extract_root}"
          test -x "${extract_root}/${name}/ccsm-desktop"
          test -x "${extract_root}/${name}/run.sh"
          test -f "${extract_root}/${name}/BUILD-INFO.txt"
          test -f "${extract_root}/${name}/LICENSE"
          test -f "${extract_root}/${name}/README.md"

      - name: Ensure lockfiles did not change
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml

      - name: Attest Windows archive
        if: runner.os == 'Windows'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release/CCSM-${{ needs.validate.outputs.version }}-windows-x64.zip

      - name: Attest Ubuntu archive
        if: runner.os == 'Linux'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release/CCSM-${{ needs.validate.outputs.version }}-ubuntu-24.04-x86_64.tar.gz

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccsm-${{ matrix.artifact }}
          path: |
            target/release/CCSM-${{ needs.validate.outputs.version }}-${{ matrix.asset }}
            target/release/CCSM-${{ needs.validate.outputs.version }}-${{ matrix.asset }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          windows="CCSM-${RELEASE_VERSION}-windows-x64.zip"
          ubuntu="CCSM-${RELEASE_VERSION}-ubuntu-24.04-x86_64.tar.gz"
          test -f "dist/${windows}"
          test -f "dist/${windows}.sha256"
          test -f "dist/${ubuntu}"
          test -f "dist/${ubuntu}.sha256"
          (
            cd dist
            sha256sum -c "${windows}.sha256"
            sha256sum -c "${ubuntu}.sha256"
            sha256sum "${windows}" "${ubuntu}" >SHA256SUMS.txt
          )

      - name: Create and publish release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="Native Windows x64 and Ubuntu 24.04 x86_64 builds generated from ${GITHUB_SHA} by GitHub Actions. Verify downloads with the adjacent .sha256 files or SHA256SUMS.txt."

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            if [[ "${is_draft}" != "true" ]]; then
              echo "Release ${tag} is already published; leaving its assets unchanged."
              exit 0
            fi
            gh release upload "${tag}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            create_args=(
              "${tag}"
              dist/*
              --repo "${GITHUB_REPOSITORY}"
              --verify-tag
              --fail-on-no-commits
              --title "CCSM v${RELEASE_VERSION}"
              --notes "${notes}"
              --generate-notes
              --draft
            )
            if [[ "${PRERELEASE}" == "true" ]]; then
              create_args+=(--prerelease --latest=false)
            fi
            gh release create "${create_args[@]}"
          fi

          edit_args=("${tag}" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft=false)
          if [[ "${PRERELEASE}" == "true" ]]; then
            edit_args+=(--prerelease --latest=false)
          else
            edit_args+=(--latest)
          fi
          gh release edit "${edit_args[@]}"
