[workspace]
members = [
  "crates/ccsm-core",
  "crates/ccsm-platform",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.5"
edition = "2024"
license = "MIT"
authors = ["CCSM contributors"]
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22.1"
ccsm-core = { path = "crates/ccsm-core" }
ccsm-platform = { path = "crates/ccsm-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
uuid = { version = "1.24.0", features = ["v4", "v5", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
