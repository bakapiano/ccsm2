[workspace]
members = [
  "crates/ccsm-core",
  "crates/ccsm-platform",
  "apps/desktop/src-tauri",
]
exclude = ["crates/vendor/tauri-runtime-wry"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.6"
edition = "2024"
license = "MIT"
authors = ["CCSM contributors"]
rust-version = "1.90"

[workspace.dependencies]
base64 = "0.22.1"
ccsm-core = { path = "crates/ccsm-core" }
ccsm-platform = { path = "crates/ccsm-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
uuid = { version = "1.24.0", features = ["v4", "v5", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
# Tauri 2.11.5 is the latest release, but its published runtime still requires
# Tao 0.35. This vendored 2.11.4 runtime applies Tauri's merged Tao 0.36/Wry
# 0.56 adapter delta while retaining released tauri-runtime and tauri-utils.
tauri-runtime-wry = { path = "crates/vendor/tauri-runtime-wry" }
