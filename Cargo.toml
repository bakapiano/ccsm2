[workspace]
members = [
  "crates/ccsm-core",
  "crates/ccsm-platform",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.5"
edition = "2024"
license = "MIT"
authors = ["CCSM contributors"]
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22.1"
ccsm-core = { path = "crates/ccsm-core" }
ccsm-platform = { path = "crates/ccsm-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
uuid = { version = "1.24.0", features = ["v4", "v5", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
# Tauri 2.11.5 is the latest release, but its published runtime still requires
# Tao 0.35. Use Tauri's merged Tao 0.36/Wry 0.56 integration until the next
# runtime release. Pinning one upstream revision keeps the three runtime crates
# on a single source and lets Cargo resolve the released Tao 0.36.0.
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "7cc68e74ff6981f5c50a52a67d56c5eb2d227188" }
